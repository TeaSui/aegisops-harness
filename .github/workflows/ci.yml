name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Official Python images: the hooks must run on Python 3.9 (macOS ships /usr/bin/python3 3.9), and
    # actions/setup-python no longer builds 3.9 for current Ubuntu runners.
    container: python:${{ matrix.python }}-bookworm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4  # the eval fixtures and their hidden checks are Node; without it those tests skip
        with:
          node-version: "22"
      - name: Tools (ruby parses YAML frontmatter and contracts when PyYAML is absent)
        run: |
          apt-get update -qq && apt-get install -y -qq ruby > /dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 --version && node --version
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Plugin structure
        run: python3 scripts/check-setup.py
      - name: Description lint
        run: python3 evals/descriptions/run.py

  # The plugin's own lifecycle gate on its own pull requests (docs/specs/). The action is the one target repositories
  # use; here it is taken from the head, because this repository is where it is developed.
  lifecycle-gate:
    name: lifecycle gate (aidlc ci)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # the head, not the merge commit: the review is stamped on it
          fetch-depth: 0                                   # the base branch and the merge base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/aidlc-gate
