name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Plugin structure
        run: python3 scripts/check-setup.py
      - name: Routing eval
        run: python3 evals/routing/run.py --quiet
      - name: Description lint
        run: python3 evals/descriptions/run.py
